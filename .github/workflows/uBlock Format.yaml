name: uBlock Format

on:
  push:
    branches: [main]
    paths:
      - 'rules/adblockdns.txt'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests
      
      - name: Run conversion script
        run: python ublock_subscribe.py rules/adblockdns.txt rules/output.txt

      - name: Commit and push output file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/output.txt
          git diff --cached --quiet || git commit -m "Update converted rules"
          git push
        continue-on-error: true
